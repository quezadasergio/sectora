# Crea instalables unsigned y los adjunta al GitHub Release al publicar un tag v*.
# Ejemplo: git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build installers and upload CI artifacts only (no GitHub Release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            gddrescue

      - name: Install macOS ddrescue
        if: matrix.platform == 'macos-14'
        run: brew install ddrescue

      - name: Prepare ddrescue sidecar (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          REQUIRE_DDRESCUE: "1"
        run: bash scripts/fetch-ddrescue.sh

      - name: Setup MSYS2 (Windows ddrescue)
        if: matrix.platform == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            make
            wget
            lzip
            tar
            coreutils

      - name: Build ddrescue sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          VERSION=1.29
          JOBS="${NUMBER_OF_PROCESSORS:-2}"
          if command -v nproc >/dev/null 2>&1; then
            JOBS="$(nproc)"
          fi
          # Prefer mingw32-make from UCRT64 toolchain; fall back to make.
          if command -v mingw32-make >/dev/null 2>&1; then
            MAKE=mingw32-make
          elif command -v make >/dev/null 2>&1; then
            MAKE=make
          else
            echo "ERROR: neither mingw32-make nor make found in PATH"
            echo "PATH=$PATH"
            exit 127
          fi
          echo "Using MAKE=$MAKE JOBS=$JOBS"
          cd /tmp
          rm -rf "ddrescue-${VERSION}" "ddrescue-${VERSION}.tar.lz"
          wget -q "https://ftp.gnu.org/gnu/ddrescue/ddrescue-${VERSION}.tar.lz"
          tar --lzip -xf "ddrescue-${VERSION}.tar.lz"
          cd "ddrescue-${VERSION}"
          # Static libgcc/libstdc++ so the NSIS-bundled sidecar does not need MinGW DLLs.
          export CXX="g++ -static-libgcc -static-libstdc++"
          export LDFLAGS="-static-libgcc -static-libstdc++"
          ./configure
          "$MAKE" -j"$JOBS"
          # Binary may be ddrescue or ddrescue.exe depending on toolchain.
          SRC=""
          for cand in ddrescue.exe ddrescue; do
            if [[ -f "$cand" ]]; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "ERROR: ddrescue binary not produced"
            ls -la
            exit 1
          fi
          WORKSPACE_UNIX="$(cygpath -u "$GITHUB_WORKSPACE")"
          DEST="${WORKSPACE_UNIX}/src-tauri/binaries/ddrescue-x86_64-pc-windows-msvc.exe"
          mkdir -p "$(dirname "$DEST")"
          cp -f "$SRC" "$DEST"
          chmod +x "$DEST"
          "$DEST" --version | head -3
          ls -lh "$DEST"

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=$([[ "${GITHUB_REF_NAME}" == *rc* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *alpha* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            V=$(node -p "require('./package.json').version")
            echo "tag=dry-run" >> "$GITHUB_OUTPUT"
            echo "version=${V}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          export VERSION="${{ steps.ver.outputs.version }}"
          echo "Release version: ${VERSION}"
          node <<'NODE'
          const fs = require('fs');
          const v = process.env.VERSION;
          if (!v) throw new Error('VERSION vacío');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = v;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const confPath = 'src-tauri/tauri.conf.json';
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          conf.version = v;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
          const cargoPath = 'src-tauri/Cargo.toml';
          let cargo = fs.readFileSync(cargoPath, 'utf8');
          cargo = cargo.replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync(cargoPath, cargo);
          console.log('Versiones actualizadas a', v);
          NODE

      - name: Verify ddrescue sidecar before build
        shell: bash
        run: |
          case "${{ matrix.rust_target }}" in
            aarch64-apple-darwin) BIN=src-tauri/binaries/ddrescue-aarch64-apple-darwin ;;
            x86_64-unknown-linux-gnu) BIN=src-tauri/binaries/ddrescue-x86_64-unknown-linux-gnu ;;
            x86_64-pc-windows-msvc) BIN=src-tauri/binaries/ddrescue-x86_64-pc-windows-msvc.exe ;;
            *) echo "unknown target"; exit 1 ;;
          esac
          test -f "$BIN"
          ls -lh "$BIN"
          if [[ "${{ matrix.platform }}" != "windows-latest" ]]; then
            "$BIN" --version | head -3
          fi

      - name: Dry-run build (artifacts only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm run tauri build -- ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: sectora-${{ matrix.rust_target }}
          path: |
            src-tauri/target/**/release/bundle/**
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/**
          if-no-files-found: warn

      - name: Build and upload to GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Sectora ${{ steps.ver.outputs.tag }}
          releaseBody: |
            Installers for **Sectora** ${{ steps.ver.outputs.tag }} (unsigned).

            - **macOS:** Apple Silicon only (`aarch64`)
            - **Windows:** x64 (NSIS)
            - **Linux:** x64 (`.deb` + AppImage)

            Includes GNU ddrescue (GPLv2+). See `THIRD_PARTY_DDRESCUE.md`.

            ### Gatekeeper / SmartScreen
            Binaries are not code-signed. On macOS use *Right-click → Open*;
            on Windows SmartScreen may show a warning.
          releaseDraft: false
          prerelease: ${{ steps.ver.outputs.prerelease }}
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}
