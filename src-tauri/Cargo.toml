[package]
name = "sectora"
version = "0.1.0"
description = "Recuperación de discos con ddrescue y exploración de archivos"
authors = ["Sergio Quezada"]
edition = "2021"

[lib]
name = "sectora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1"
once_cell = "1"
ntfs = "0.4"
plist = "1"
fs2 = "0.4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
